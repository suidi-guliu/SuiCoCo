# suicoco 插件构建流水线：push 到 main 后自动从 plugins/ 源码
# 构建 .suicj 产物并提交回 release/，使官方插件下载 raw 链接始终有效。
name: build-plugins
on:
  push:
    branches: [main]
  workflow_dispatch:

# 多个 commit 紧邻推送时，串行化产物提交，避免 `git push` 非快进冲突
concurrency:
  group: build-plugins-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: 校验插件源码
        run: |
          pip install -q python3 2>/dev/null || true
          python3 scripts/embed-plugins.py
          for d in plugins/*/; do bash scripts/build-plugin.sh "$d"; done
          bash scripts/verify-plugin.sh
          # 关键：zip -r 会写入 mtime，重打包后字节/SHA256 变化；按真实产物回写清单摘要，
          # 保证「一键下载 + SHA256 校验」永远与用户实际下载到的字节一致（否则全部安装被拒）。
          python3 scripts/sync-catalog-sha.py

      - name: 提交构建产物
        run: |
          git config user.name "suicoco-bot"
          git config user.email "bot@suicoco.local"
          git add release/ app/js/plugin-bundle.js
          git diff --cached --quiet && echo "无变更" && exit 0
          git commit -m "chore(release): build .suicj artifacts [skip ci]"
          git push
