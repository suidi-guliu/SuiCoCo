name: Build suicoco

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: 编译安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 自包含安装 Android commandline-tools：不依赖第三方 setup-android action（近期持续故障），
      # 也不假设 runner 预装的 sdkmanager 在 PATH 中（实测 command not found）
      - name: 安装 Android SDK cmdline-tools
        run: |
          set -e
          export SDK_ROOT="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version

      - name: 接受许可证并安装 NDK/CMake/平台
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.31.6"

      - name: 写入 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: Gradle 编译
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: suicoco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-plugins:
    name: 构建 .suicj 插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zip
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: 打包插件
        run: |
          chmod +x scripts/*.sh
          for p in plugins/*/; do bash scripts/build-plugin.sh "$p"; done

      - name: 校验插件
        run: bash scripts/verify-plugin.sh

      - name: 上传插件包
        uses: actions/upload-artifact@v4
        with:
          name: suicj-plugins
          path: release/*.suicj
