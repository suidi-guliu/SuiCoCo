name: Build suicoco

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: 编译安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 预装 Android SDK（$ANDROID_HOME=/usr/local/lib/android/sdk），
      # 不依赖第三方 setup-android action（该 action 近期持续故障，导致 CI 连续失败）
      - name: 接受 SDK 许可证并确认 SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --version

      - name: 安装 NDK 与 CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.31.6"

      - name: 写入 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: Gradle 编译
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: suicoco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-plugins:
    name: 构建 .suicj 插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zip
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: 打包插件
        run: |
          chmod +x scripts/*.sh
          for p in plugins/*/; do bash scripts/build-plugin.sh "$p"; done

      - name: 校验插件
        run: bash scripts/verify-plugin.sh

      - name: 上传插件包
        uses: actions/upload-artifact@v4
        with:
          name: suicj-plugins
          path: release/*.suicj
