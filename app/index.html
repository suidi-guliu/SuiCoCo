<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>suicoco</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- ==================== 标题栏 ==================== -->
  <div id="titlebar">
    <div id="menubar">
      <div class="menu-item">文件</div>
      <div class="menu-item">编辑</div>
      <div class="menu-item">选择</div>
      <div class="menu-item">查看</div>
      <div class="menu-item">转到</div>
      <div class="menu-item">运行</div>
      <div class="menu-item">终端</div>
      <div class="menu-item">帮助</div>
    </div>
    <div id="title-center">suicoco — suicoco-demo</div>
    <div id="title-controls">
      <button class="title-ctl" title="最小化">─</button>
      <button class="title-ctl" title="最大化">□</button>
      <button class="title-ctl close" title="关闭">✕</button>
    </div>
  </div>

  <!-- ==================== 工作台 ==================== -->
  <div id="workbench">
    <!-- 活动栏（无 AI 入口） -->
    <div id="activitybar">
      <button class="act-btn active" data-view="explorer" title="资源管理器 (Ctrl+Shift+E)">
        <svg viewBox="0 0 24 24"><path d="M13 4h-3l-1-1H6L5 4H3v16h18V6h-2v13H5V8h14V4h-6z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="act-btn" data-view="search" title="搜索 (Ctrl+Shift+F)">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 15.5 L21 21" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="act-btn" data-view="scm" title="源代码管理 (Ctrl+Shift+G)">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 8.4v7.2M8 7c6 0 8 2 8 3M16 14.2c-2 2-6 2.4-8 2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button class="act-btn" data-view="run" title="运行和调试 (Ctrl+Shift+D)">
        <svg viewBox="0 0 24 24"><path d="M5 3.5v17l14-8.5z" fill="currentColor"/></svg>
      </button>
      <button class="act-btn" data-view="plugins" title="插件市场 (Ctrl+Shift+X)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <span class="badge" id="badge-plugins">3</span>
      </button>
      <button class="act-btn" data-view="installer" title="系统与环境安装">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="act-btn" id="act-settings" title="管理">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>

    <!-- 侧边栏 -->
    <div id="sidebar">
      <div class="sidebar-title">
        <span class="vt">资源管理器</span>
        <span class="view-actions">
          <button title="新建文件" onclick="window.suicocoHost.notify('info','suicoco','演示版暂不提供文件新建，编辑现有文件即可')">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </span>
      </div>
      <div class="sidebar-body"></div>
    </div>

    <!-- 主区域 -->
    <div id="main-area">
      <div id="tabbar"></div>
      <div id="breadcrumbs"></div>
      <div id="editor-host"></div>
      <!-- 底部面板 -->
      <div id="panel">
        <div id="panel-tabs">
          <div class="panel-tab" data-view="problems">问题</div>
          <div class="panel-tab" data-view="output">输出</div>
          <div class="panel-tab active" data-view="terminal">终端</div>
          <span class="panel-right-actions"><button id="panel-close" title="关闭面板">✕</button></span>
        </div>
        <div id="panel-body">
          <div id="problems-view" style="display:none"></div>
          <div id="output-view" style="display:none"><div class="markdownish">[输出] 插件与安装器日志将输出至此（桌面版接真实子进程 stdout）。</div></div>
          <div id="terminal-view">
            <div id="terminal-input-row"><span class="prompt">suicoco@demo:~$</span><input id="terminal-input" autocomplete="off" spellcheck="false"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 状态栏 ==================== -->
  <div id="statusbar">
    <span class="sb-item remote" title="远程/环境">◈ suicoco 环境</span>
    <span class="sb-item" id="sb-env" title="已安装环境">环境: 未安装</span>
    <span class="sb-item" title="源代码管理">⎇ main</span>
    <span class="sb-item err-count" id="sb-err" title="错误">✕ 0</span>
    <span class="sb-item warn-count" id="sb-warn" title="警告">⚠ 0</span>
    <span class="sb-item right" id="sb-plugins" title="插件数">🧩 0</span>
    <span class="sb-sep"></span>
    <span class="sb-item" id="sb-ln">行 1，列 1</span>
    <span class="sb-sep"></span>
    <span class="sb-item">空格: 4</span>
    <span class="sb-sep"></span>
    <span class="sb-item">UTF-8</span>
    <span class="sb-sep"></span>
    <span class="sb-item">LF</span>
    <span class="sb-sep"></span>
    <span class="sb-item" id="sb-lang">纯文本</span>
    <span class="sb-item" title="通知">🔔</span>
  </div>

  <!-- 快速输入（Ctrl+P / Ctrl+Shift+P） -->
  <div id="quick-input" style="display:none">
    <div class="qi-input-wrap"><input placeholder="输入命令名称"></div>
    <div class="qi-list"></div>
  </div>

  <!-- 补全弹层 -->
  <div id="suggest-widget"></div>

  <!-- 通知区 -->
  <div id="notifications"></div>

  <script src="js/data.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/plugin-engine.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/plugin-bundle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
